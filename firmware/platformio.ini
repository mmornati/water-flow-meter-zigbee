; PlatformIO build for the water flow meter (Seeed XIAO ESP32-C6, Zigbee router).
; Build:  pio run                 (from this folder)
; Flash:  pio run -t upload
; Logs:   pio device monitor
; Tests:  pio test -e native      (host unit tests, no board needed)

[platformio]
src_dir = flow_meter
default_envs = xiao_esp32c6

[env:xiao_esp32c6]
; pioarduino: community platform that ships the arduino-esp32 3.x core.
; Pinned so every build uses the same core (arduino-esp32 3.3.12).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = seeed_xiao_esp32c6
framework = arduino

; Same as Arduino IDE: Zigbee mode = ZCZR, Partition Scheme = Zigbee ZCZR 4MB with spiffs
board_build.partitions = zigbee_zczr.csv
build_flags =
    -DZIGBEE_MODE_ZCZR
    -lesp_zb_api.zczr
    -lzboss_stack.zczr
    -lzboss_port.native
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -Wall
    -Wextra
    ; Uncomment once the battery divider is wired to D0 (docs/01-hardware-and-wiring.md)
    ; -DBATTERY_ADC_PIN=0

lib_deps =
    adafruit/Adafruit BME280 Library@^2.3.0

monitor_speed = 115200

[env:native]
; Host unit tests for the hardware-free logic in flow_logic.h
platform = native
test_framework = unity
build_flags =
    -std=c++17
    -Wall
    -Wextra
    -Werror
    -DUNITY_INCLUDE_DOUBLE
    -I flow_meter
